name: CI

# Every push and pull request: lint, tests, chart and Terraform checks.
# Pushes to main also build the image and push it to Artifact Registry, once
# the GCP repository variables exist (see infra/README.md); until then that
# job is skipped, so CI never needs cloud access to go green.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (CPU-only torch, as in the image)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu \
            torch==2.11.0 torchvision==0.26.0
          pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Generated code is up to date
        run: |
          python -m grpc_tools.protoc -I proto --python_out=. --pyi_out=. \
            --grpc_python_out=. proto/kubesplit/kubesplit.proto
          python scripts/make_dashboard.py
          git diff --exit-code
      - name: Tests (synthetic data, no download)
        run: pytest -q

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: helm lint charts/kubesplit --strict
      - run: helm lint charts/kubesplit --strict -f deploy/kind/values.yaml
      - run: helm lint charts/kubesplit --strict -f deploy/gke/values.yaml --set image.repository=example
      - name: Rendered manifests match the Kubernetes and CRD schemas
        run: |
          for values in deploy/kind/values.yaml deploy/gke/values.yaml; do
            helm template kubesplit charts/kubesplit -f "$values" \
              --set image.repository=example --set run.netDelayMs=50
          done | docker run --rm -i ghcr.io/yannh/kubeconform:v0.6.7 -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - name: fmt and validate both stacks (no credentials, no backend)
        run: make tf-check

  image:
    needs: [python, chart]
    if: github.event_name == 'push' && vars.GCP_WIF_PROVIDER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token Workload Identity Federation trades for GCP credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: CIFAR-10 for the image (cached across runs)
        id: cifar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/cifar-10-batches-py
          key: cifar-10-batches-py-c58f30108f718f92721af3b95e74349a
      # The official archive, copied byte for byte to the project's data bucket:
      # its canonical host can take 25 minutes, the bucket takes seconds.
      - name: Copy CIFAR-10 from the data bucket
        if: steps.cifar.outputs.cache-hit != 'true'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          URL: https://storage.googleapis.com/${{ vars.GCP_PROJECT_ID }}-data/cifar-10-python.tar.gz
        run: |
          curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" -o /tmp/cifar.tar.gz "$URL"
          echo "c58f30108f718f92721af3b95e74349a  /tmp/cifar.tar.gz" | md5sum -c -
          mkdir -p data && tar -xzf /tmp/cifar.tar.gz -C data
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ vars.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: . # the checkout plus data/, not a fresh git clone
          push: true
          tags: |
            ${{ vars.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ vars.IMAGE_REPOSITORY }}:main
          # The torch layer is ~1 GB; reuse it across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max
