# One training run. The server owns these settings; clients receive them on Join.
run:
  mode: decoupled      # vanilla | decoupled
  clients: 4           # expected clients (quorum is a % of this)
  rounds: 5
  quorumPct: 100       # % of clients that must report to close a round early
  roundTimeout: 600    # seconds; then the round closes with whoever reported
  partition: iid       # iid | dirichlet
  alpha: 0.5           # Dirichlet concentration (partition: dirichlet only)
  seed: 0
  batchSize: 64
  lr: 0.05
  dataset: cifar10     # cifar10 | fake (synthetic, nothing to download)
  maxBatches: 0        # per client per round; 0 = whole shard
  runId: ""            # results file name; empty = <mode>-c<clients>-<timestamp>

image:
  repository: kubesplit
  tag: dev             # empty = the chart's appVersion
  pullPolicy: IfNotPresent

server:
  port: 50051
  metricsPort: 8000
  # requests == limits gives the pod "Guaranteed" QoS: it always gets exactly
  # this much CPU, so round timings don't depend on what else runs on the node.
  resources:
    requests:
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 2Gi
  nodeSelector: {}
  tolerations: []

# Scraping by the Prometheus Operator (e.g. kube-prometheus-stack). Leave off
# on clusters without it: the ServiceMonitor type wouldn't exist there.
serviceMonitor:
  enabled: false
  interval: 5s   # rounds can be seconds long; scrape often enough to see them

# The Grafana dashboard, as a ConfigMap for Grafana's sidecar to pick up.
# It has a Release picker, so with several releases enable it on just one.
grafanaDashboard:
  enabled: false

# One client pod per run.clients, named <release>-client-0, -1, ...;
# the trailing number is the pod's data shard.
client:
  metricsPort: 8000
  # How long a client keeps retrying to reach the server at startup (seconds).
  connectTimeout: 900
  # Same reasoning as the server: requests == limits for steady timings.
  resources:
    requests:
      cpu: "1"
      memory: 1536Mi
    limits:
      cpu: "1"
      memory: 1536Mi
  nodeSelector: {}
  tolerations: []
