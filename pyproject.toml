[project]
name = "kubesplit"
version = "0.1.0"
description = "Kubernetes-native split learning: decoupled vs. vanilla, measured"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    # Generated stubs in kubesplit/ require at least the versions that made them.
    "grpcio>=1.85",
    "protobuf>=7.35.1,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "grpcio-tools==1.85.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kubesplit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["kubesplit/*_pb2*.py", "kubesplit/*_pb2*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
